syntax = "proto3";

package transaction;

option go_package = "github.com/Ephraimdebel/transaction-switch/internal/transaction/api/gen/transactionpb";
// option go_package = "google.golang.org/grpc/examples/route_guide/routeguide";


service TransactionService {
  rpc ReserveTransaction (ReserveTransactionRequest)
      returns (ReserveTransactionResponse);
}

message ReserveTransactionRequest {
  string transaction_id = 1;
  int64 amount = 2;
}

message ReserveTransactionResponse {
  string status = 1;
}
